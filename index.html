<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>写给你的情书 · 我们的时间轴</title>
<meta name="description" content="一个程序员写给爱人的情书：左边是誓言，右边是我们一起走过的日子。">
<meta name="author" content="阿远">
<meta name="theme-color" content="#fbf4ef">
<meta property="og:title" content="写给你的情书">
<meta property="og:description" content="左边是誓言，右边是我们一起走过的日子。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 28s-11-6.7-11-14a6 6 0 0 1 11-3.2A6 6 0 0 1 27 14c0 7.3-11 14-11 14z' fill='%23c25b6e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/timeline.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body data-palette="rose" class="is-locked">

<!-- 门：没有口令看到的就是这一屏 -->
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gateForm" novalidate>
    <p class="gate-eyebrow">PRIVATE · 只有我们俩</p>
    <h1 class="gate-title">这封情书，是锁着的</h1>
    <p class="gate-sub">选一下你是谁，再输入只属于你的口令。</p>

    <div class="gate-accounts" id="gateAccounts"></div>

    <label class="gate-field">
      <span>口令</span>
      <input id="gatePass" type="password" autocomplete="current-password" spellcheck="false" placeholder="……">
    </label>

    <label class="gate-remember">
      <input id="gateRemember" type="checkbox" checked>
      <span>在这台设备记住 7 天</span>
    </label>

    <button class="gate-submit" id="gateSubmit" type="submit">打开</button>
    <p class="gate-error" id="gateError" role="alert"></p>
    <p class="gate-foot">没有口令的话，这里只有一堆解不开的密文。</p>
  </form>
</div>

<!-- 氛围层：光晕 + 纸纹 + 飘落的心 -->
<div class="ambient" aria-hidden="true">
  <div class="aura aura-a"></div>
  <div class="aura aura-b"></div>
  <div class="aura aura-c"></div>
  <div class="grain"></div>
  <div class="petals" id="petals"></div>
</div>

<div class="app" id="app">
  <div class="user-dock" id="userDock" hidden></div>

  <aside class="pane pane-left" aria-label="爱情誓言">
    <div class="scroll scroll-left" id="leftPane">
      <div class="loading">
        <span class="loading-heart" aria-hidden="true"></span>
        <p>正在拆开信封…</p>
      </div>
    </div>
  </aside>

  <main class="pane pane-right" aria-label="恋爱时间轴">
    <div class="scroll scroll-right" id="rightPane">
      <div class="loading">
        <span class="loading-heart" aria-hidden="true"></span>
        <p>正在翻开时间轴…</p>
      </div>
    </div>
  </main>
</div>

<button class="edit-fab" id="editFab" type="button" title="编辑内容（Ctrl/⌘ + E）">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10-10-4-4L4 16v4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M13.5 6.5 17.5 10.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
  <span>编辑</span>
</button>

<div class="toast-root" id="toastRoot" aria-live="polite"></div>
<div id="editorRoot"></div>

<noscript>
  <div class="noscript">这封情书需要开启 JavaScript 才能打开 ❤</div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
